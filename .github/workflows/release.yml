name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publisher (OIDC): PyPI 侧预配置 owner/repo/workflow/environment 后免 token 发布
    # 显式声明 permissions 后未列出的权限归零:contents: read 是 checkout 的 fetch 所必需
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches version
        # PyPI 版本不可重传:tag 与 pyproject 版本不一致必须在这里响亮失败
        run: |
          VERSION="v$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject ${VERSION}"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Sync server.json with release version
        # Registry 条目的版本必须与本次发布的 PyPI 版本一致；只改发布载荷，不回写仓库
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "import json,sys; v=sys.argv[1]; d=json.load(open('server.json')); d['version']=v; [p.update(version=v) for p in d.get('packages',[])]; json.dump(d, open('server.json','w'), indent=2, ensure_ascii=False)" "$VERSION"

      - name: Install mcp-publisher
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        # OIDC 登录复用上面 id-token: write 权限，无需额外 secret；
        # 若此步失败，PyPI 已成功，可本地 login + publish 手动补救
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
