name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy:
    # 隐私门禁（权威拦截）：禁串来自 PRIVACY_PATTERNS Secret，绝不写入仓库；
    # fork PR 拿不到 Secret，检查脚本缺 patterns 时警告放行（见 docs/agents/privacy-gate.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: bash scripts/check-privacy.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python 声称 >=3.11:矩阵让它成为被验证的承诺而非推断
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Type check
        # mypy 的 python_version 固定 3.13(见 pyproject),跑一次即可
        if: matrix.python-version == '3.13'
        run: uv run mypy src/compound_memory/

      - name: Wheel smoke test
        # 发布标准的固化:纯 wheel(无 dev/vec extra)必须可安装、CLI 与 server 可跑
        run: |
          uv build
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          export COMPOUND_MEMORY_ROOT=.smoke-root
          .smoke-venv/bin/compound-memory init
          .smoke-venv/bin/compound-memory write "ci smoke entry" episode agent-ci > /dev/null
          .smoke-venv/bin/compound-memory search "ci smoke" | grep -q "ci smoke entry"
          .smoke-venv/bin/compound-memory-server < /dev/null
