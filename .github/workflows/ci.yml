name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy:
    # 隐私门禁（权威拦截）：禁串来自 PRIVACY_PATTERNS Secret，绝不写入仓库；
    # fork PR 拿不到 Secret，检查脚本缺 patterns 时警告放行（见 docs/agents/privacy-gate.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: bash scripts/check-privacy.sh

  test:
    strategy:
      # bring-up 期不相互取消：Windows 首上（#55），单点失败也要看全其余组合的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # requires-python 声称 >=3.11:矩阵让它成为被验证的承诺而非推断
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Type check
        # mypy 的 python_version 固定 3.13(见 pyproject),跑一次即可
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run mypy src/compound_memory/

      - name: Git call shape check
        # _git 调用点必须显式传 check=(scripts/check_git_calls.py,同 pre-commit 本地层)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run python scripts/check_git_calls.py

      - name: Wheel smoke test
        # 纯 wheel（无 dev/vec extra）必须可安装，CLI 与 server 可跑。
        # Linux 与 Windows 都跑（#58）；脚本按 uname 选 bin/ 或 Scripts\。
        shell: bash
        run: bash scripts/wheel_smoke.sh
