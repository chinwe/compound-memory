name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 workflow + ref 只留最新一次运行。pull_request 的 ref 是 refs/pull/<n>/merge
# （按 PR 取消），push 的 ref 是 refs/heads/main。新推送会取消仍在跑的上一次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    # 隐私门禁（权威拦截）：禁串来自 PRIVACY_PATTERNS Secret，绝不写入仓库；
    # fork PR 拿不到 Secret，检查脚本缺 patterns 时警告放行（见 docs/agents/privacy-gate.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: bash scripts/check-privacy.sh

  test:
    strategy:
      # 单格失败即取消同一次运行的其余矩阵格。Windows 首上期（#55）曾用 false，
      # 以便一次看全组合；现在失败尽早停。
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        # requires-python 声称 >=3.11：Ubuntu 在 PR 与 push main 上都跑 3.11 + 3.12 + 3.13。
        # Windows 矩阵：
        # - pull_request：只留 3.12，恰好一个 Windows job。
        # - push main（以及任何非 pull_request 触发）：3.11 + 3.12 + 3.13，三个 Windows job。
        # exclude 的版本只在 pull_request 上是 3.11/3.13；其它事件求值为 none，
        # 匹配不到任何格子，因此不会缩掉 push 路径。
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: ${{ github.event_name == 'pull_request' && '3.11' || 'none' }}
          - os: windows-latest
            python-version: ${{ github.event_name == 'pull_request' && '3.13' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Type check
        # mypy 的 python_version 固定 3.13(见 pyproject),跑一次即可。
        # 全包非 strict；validation / paths / server 由 pyproject 的
        # per-module overrides 按 strict 等价旗标失败。不要改成全库 --strict。
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run mypy src/compound_memory/

      - name: Git call shape check
        # _git 调用点必须显式传 check=(scripts/check_git_calls.py,同 pre-commit 本地层)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run python scripts/check_git_calls.py

      - name: DSH plugin manifest
        # integrations/dsh 是暂存树，可安装单元是该目录。校验 dsh.bundle、stdio 启动行，
        # 以及 npm pack --dry-run 的文件清单。不碰 Python 包版本。
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run python scripts/check_dsh_plugin.py

      - name: Wheel smoke test
        # 纯 wheel（无 dev/vec extra）必须可安装，CLI 与 server 可跑。
        # 钉在 ubuntu × 3.13 一格，不再铺满 OS×Python（曾是 6 格，#58）。
        # 脚本仍按 uname 选 bin/ 或 Scripts\，Windows 路径留在脚本里，CI 不逐格重跑。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: bash scripts/wheel_smoke.sh
