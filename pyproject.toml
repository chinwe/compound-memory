[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-memory"
version = "0.1.0"
description = "Local multi-agent shared memory with compounding (MCP server + CLI)"
requires-python = ">=3.11"
dependencies = ["mcp>=2", "PyYAML>=6"]

[project.scripts]
compound-memory = "compound_memory.cli:main"
compound-memory-server = "compound_memory.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "types-PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
