[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-memory"
version = "0.5.7"
description = "Local multi-agent shared memory with compounding (MCP server + CLI)"
readme = "README.md"
# PEP 639 SPDX 表达式；与 License:: classifier 互斥，故后者已移除
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "chinwe"}]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["mcp>=2", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/chinwe/compound-memory"
Issues = "https://github.com/chinwe/compound-memory/issues"

[project.scripts]
compound-memory = "compound_memory.cli:main"
compound-memory-server = "compound_memory.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "types-PyYAML>=6", "sqlite-vec>=0.1.9"]
# 向量召回路（可选）：未安装时 search 自动降级纯词面（检索降级不报错）。
# onnxruntime 钉 1.19.2：macOS x64 可装的最新版（1.20+ 的 wheel 标签要求 macOS 13+）
vec = ["onnxruntime==1.31.0", "tokenizers>=0.20", "numpy>=1.26", "sqlite-vec>=0.1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
# 全包保持非 strict。收紧只发生在下面的 per-module overrides，
# 其余模块继续按这组宽松旗标检查（CI 同一条 mypy 命令）。
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnxruntime", "tokenizers.*", "tokenizers", "sqlite_vec.*", "sqlite_vec", "numpy.*", "numpy"]
ignore_missing_imports = true

# 渐进收紧的第一批（P1.5）：校验、路径、MCP 边界。旗标对齐 mypy --strict
# 里可按模块设置的子集（warn_redundant_casts 在 mypy 2.x 不是 per-module
# 旗标，写进 override 只会产生警告并被丢弃，故不放这里）。
# 不要在本段写 strict = true——mypy 会把该键作用到全局 Options，等于整包 strict。
[[tool.mypy.overrides]]
module = [
    "compound_memory.storage.validation",
    "compound_memory.storage.paths",
    "compound_memory.server",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
